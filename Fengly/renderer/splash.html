<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>机器人控制台</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(140deg, #e9f8ff, #d4edff); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; -webkit-app-region: no-drag; }
    .splash {
      width: 300px; padding: 40px 30px; border-radius: 24px; text-align: center;
      background: linear-gradient(160deg, rgba(255,255,255,0.93) 0%, rgba(222,244,255,0.93) 100%);
      border: 1px solid rgba(91,231,255,0.4);
      box-shadow: 0 24px 70px rgba(14,116,180,0.28);
      animation: splashIn .55s cubic-bezier(0.2, 0.6, 0.2, 1) both;
    }
    @keyframes splashIn { from { opacity: 0; transform: scale(0.88) translateY(14px); } to { opacity: 1; transform: none; } }
    body {
      background: linear-gradient(140deg, #e9f8ff, #d4edff, #dbeafe);
      animation: splashBg 6s ease-in-out infinite alternate;
    }
    @keyframes splashBg { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
    .logo-circle { animation: floaty 2.8s ease-in-out infinite;
      width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 38px;
      background: conic-gradient(from 0deg, #5BE7FF, #3b82f6, #22d3ee, #5BE7FF);
    }
    .logo-inner { width: 68px; height: 68px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; }
    @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} } 10%{transform:translateY(-12px) scale(1.06);} 20%{transform:translateY(0) scale(0.95);} 30%{transform:translateY(-7px) scale(1.04);} 40%{transform:translateY(0) scale(0.98);} 50%{transform:translateY(-3px) scale(1.01);} 60%{transform:translateY(0);} }
@keyframes spin { to { transform: rotate(360deg); } }
    .bar { height: 7px; border-radius: 4px; background: rgba(91,231,255,0.18); overflow: hidden; }
    .bar > div { height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #5BE7FF, #3b82f6, #22d3ee); background-size: 200% 100%; animation: slide 1.4s ease-in-out infinite; box-shadow: 0 0 12px rgba(91,231,255,0.6); }
    @keyframes slide { 0% { background-position: 0% 0; transform: translateX(-60%);} 100% { background-position: 100% 0; transform: translateX(260%);} }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-circle"><div class="logo-inner"><span id="splash-emoji">🦊</span><img src="assets/logo-splash.png" style="width:100%;height:100%;object-fit:contain;display:none" onload="this.style.display=&quot;block&quot;;document.getElementById(&quot;splash-emoji&quot;).style.display=&quot;none&quot;" onerror="this.onerror=null;this.src=&quot;assets/logo.png&quot;;"></div></div>
    <div class="bar"><div></div></div>
    <div id="splash-msg" style="margin-top:10px;font-size:12px;opacity:.75;text-align:center;min-height:16px"></div>
  </div>
  <script>
    try {
      require('electron').ipcRenderer.on('progress', (e, msg) => {
        const el = document.getElementById('splash-msg');
        if (el) el.textContent = String(msg || '');
      });
    } catch (e) {}
  </script>
</body>
</html>
