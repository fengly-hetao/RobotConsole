<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; font-src 'self' data:;">
  <title>机器人控制台</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
</head>
<body>
  <!-- 应用内加载画面（页面资源就绪前） -->
  <div id="boot-overlay">
    <div class="boot-box">
      <div class="boot-ring"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="drag-strip"></div>
    <aside id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-dot" id="logo-dot">🦊</span>
        <div class="logo-text">
          <div class="logo-name">机器人控制台</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="status-pill" id="global-status">● 未连接</div>
        <button class="btn sm ghost" id="btn-fullscreen" style="margin-top:10px;width:100%;justify-content:center">⛶ <span data-i18n="nav.fullscreen"></span></button>
      </div>
    </aside>

    <main id="content">
      <!-- 各页面由 app.js 渲染 -->
      <section class="page" id="page-home"></section>
      <section class="page" id="page-webui"></section>
      <section class="page" id="page-config"></section>
      <section class="page" id="page-code"></section>
      <section class="page" id="page-terminal"></section>
      <section class="page" id="page-resources"></section>
      <section class="page" id="page-settings"></section>
      <section class="page" id="page-features"></section>
      <section class="page" id="page-messages"></section>
      <section class="page" id="page-backup"></section>
      <section class="page" id="page-feedback"></section>
      <section class="page" id="page-toolbox"></section>
      <section class="page" id="page-persona"></section>
      <section class="page" id="page-about"></section>
      <section class="page" id="page-help"></section>
    </main>
  </div>

  <div id="toast-root"></div>

  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/monaco/min/vs/loader.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
